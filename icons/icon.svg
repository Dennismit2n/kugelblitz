<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kugelblitz: Chromkugel mit Blitz im Beschlag der Werkstatt (Platte, eckiger Rahmen, vier Weißgold-Schrauben,
       Kappe im Verlauf der Startseite). Licht von rechts oben, Schatten nach links unten. -->
  <defs>
    <linearGradient id="platte" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26254F"/>
      <stop offset=".5" stop-color="#1C1B3E"/>
      <stop offset="1" stop-color="#121128"/>
    </linearGradient>
    <radialGradient id="aurora1" cx=".18" cy=".12" r=".55">
      <stop offset="0" stop-color="#4B3CAB" stop-opacity=".42"/>
      <stop offset="1" stop-color="#4B3CAB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx=".92" cy=".22" r=".5">
      <stop offset="0" stop-color="#015BA6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#015BA6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kappe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5A5FF"/>
      <stop offset=".5" stop-color="#75C7FF"/>
      <stop offset="1" stop-color="#AFA1FF"/>
    </linearGradient>
    <clipPath id="rund"><rect width="512" height="512" rx="104"/></clipPath>
    <radialGradient id="schatten" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#000" stop-opacity=".6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chrom" cx=".66" cy=".3" r=".96" fx=".66" fy=".3">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".07" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#BDB8E6"/>
      <stop offset=".5" stop-color="#6E68A4"/>
      <stop offset=".56" stop-color="#26234B"/>
      <stop offset="1" stop-color="#4A4680"/>
    </radialGradient>
    <linearGradient id="gold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFCEE"/>
      <stop offset=".35" stop-color="#F1E4BC"/>
      <stop offset=".7" stop-color="#C4A964"/>
      <stop offset="1" stop-color="#7A6226"/>
    </linearGradient>
    <linearGradient id="blitz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9E2FF"/>
      <stop offset=".45" stop-color="#75C7FF"/>
      <stop offset="1" stop-color="#AFA1FF"/>
    </linearGradient>
    <filter id="weich" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <!-- Schraube der Startseite (12 Einheiten), Schlitzwinkel je Ecke 32, -58, 78, -14 Grad -->
    <radialGradient id="sS" cx="42%" cy="58%" r="50%"><stop offset="55%" stop-opacity=".6"/><stop offset="100%" stop-opacity="0"/></radialGradient>
    <radialGradient id="sK" cx="66%" cy="30%" r="78%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".2" stop-color="#FFFCEE"/><stop offset=".5" stop-color="#F1E4BC"/><stop offset=".8" stop-color="#C4A964"/><stop offset="1" stop-color="#7A6226"/></radialGradient>
    <linearGradient id="sM" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A6A22" stop-opacity=".55"/><stop offset=".5" stop-color="#FFF3C4" stop-opacity="0"/><stop offset="1" stop-color="#FFFBEA" stop-opacity=".7"/></linearGradient>
    <g id="schraube">
      <circle cx="5.1" cy="6.9" r="5" fill="url(#sS)"/>
      <circle cx="6" cy="6" r="4.3" fill="url(#sK)"/>
      <circle cx="6" cy="6" r="4.3" fill="none" stroke="#553E0C" stroke-opacity=".6" stroke-width=".45"/>
      <circle cx="6" cy="6" r="2.9" fill="none" stroke="url(#sM)" stroke-width=".5"/>
    </g>
    <g id="schlitz">
      <path d="M2.5 6h7" stroke="#3A2A07" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M2.7 6.62h6.6" stroke="#FFF7DA" stroke-opacity=".75" stroke-width=".3" stroke-linecap="round"/>
    </g>
    <ellipse id="glanz" cx="7.7" cy="3.9" rx="1.05" ry=".6" transform="rotate(-35 7.7 3.9)" fill="#FFFFFF" fill-opacity=".9"/>
  </defs>

  <g clip-path="url(#rund)">
    <rect width="512" height="512" fill="url(#platte)"/>
    <rect width="512" height="512" fill="url(#aurora1)"/>
    <rect width="512" height="512" fill="url(#aurora2)"/>
    <rect width="512" height="9" fill="url(#kappe)" opacity=".9"/>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="102" fill="none" stroke="#2D2C4F" stroke-width="4"/>
  <rect x="40" y="40" width="432" height="432" fill="none" stroke="#B4B5FF" stroke-opacity=".3" stroke-width="4"/>

  <g transform="translate(52 52) scale(3.333)"><use href="#schraube"/><g transform="rotate(32 6 6)"><use href="#schlitz"/></g><use href="#glanz"/></g>
  <g transform="translate(420 52) scale(3.333)"><use href="#schraube"/><g transform="rotate(-58 6 6)"><use href="#schlitz"/></g><use href="#glanz"/></g>
  <g transform="translate(52 420) scale(3.333)"><use href="#schraube"/><g transform="rotate(78 6 6)"><use href="#schlitz"/></g><use href="#glanz"/></g>
  <g transform="translate(420 420) scale(3.333)"><use href="#schraube"/><g transform="rotate(-14 6 6)"><use href="#schlitz"/></g><use href="#glanz"/></g>

  <!-- Schatten der Kugel nach links unten -->
  <circle cx="240" cy="276" r="166" fill="url(#schatten)"/>
  <!-- Fassung aus Weißgold -->
  <circle cx="256" cy="256" r="149" fill="none" stroke="url(#gold)" stroke-width="11"/>
  <circle cx="256" cy="256" r="143" fill="none" stroke="#553E0C" stroke-opacity=".55" stroke-width="2"/>
  <!-- Chromkugel -->
  <circle cx="256" cy="256" r="141" fill="url(#chrom)"/>
  <circle cx="256" cy="256" r="141" fill="none" stroke="#1A1838" stroke-width="3"/>
  <path d="M144 318a141 141 0 0 0 122 79" fill="none" stroke="#AFA1FF" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
  <!-- Blitz: Eisblau zu Lavendel, Kante Weißgold, eigener Schatten nach links unten -->
  <path d="M286 118 L196 266 L246 266 L214 398 L312 234 L260 234 L314 118 Z" fill="#000" opacity=".45" transform="translate(-10 12)" filter="url(#weich)"/>
  <path d="M286 118 L196 266 L246 266 L214 398 L312 234 L260 234 L314 118 Z" fill="url(#blitz)" stroke="#F1E4BC" stroke-width="6" stroke-linejoin="round"/>
  <path d="M292 132 L214 258" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
  <!-- Glanzpunkt zur Lichtquelle -->
  <ellipse cx="336" cy="190" rx="22" ry="12" transform="rotate(-35 336 190)" fill="#FFFFFF" fill-opacity=".85"/>
</svg>
